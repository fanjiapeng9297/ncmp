name: Keepalive
on:
  schedule:
    - cron: '0 0 1 * *' # UTC时间，每月1号执行保活
  workflow_dispatch:    # 支持手动点一下立即跑保活
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 保活空提交
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "keepalive reset 60d timer"
          git push
